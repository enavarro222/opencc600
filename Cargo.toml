# Host workspace: hardware-independent `no_std` crates, tested on a PC (stable toolchain).
# The Xtensa firmware is a separate project in firmware/ (esp toolchain), which uses these crates by path.
[workspace]
resolver = "3"
members  = ["crates/*"]
exclude  = ["firmware"]

[workspace.package]
edition      = "2024"
license      = "GPL-3.0-or-later"
rust-version = "1.95"
version      = "0.0.3"

# Formats and protocol shared with the companion app Musette (MIT): the only copy of them. While changing them, point
# at a local clone with a `[patch."https://github.com/enavarro222/musette"]` in an untracked `.cargo/config.toml`.
[workspace.dependencies]
protocol-cc600 = { package = "protocol-cc600", git = "https://github.com/enavarro222/musette", rev = "003aa264cdd0015cb09080e2816320622aa783f9" }
route          = { package = "route-cc600", git = "https://github.com/enavarro222/musette", rev = "003aa264cdd0015cb09080e2816320622aa783f9" }
settings       = { package = "settings-cc600", git = "https://github.com/enavarro222/musette", rev = "003aa264cdd0015cb09080e2816320622aa783f9" }
