[package]
edition      = "2024"
name         = "opencc600-firmware"
rust-version = "1.95"
version      = "0.1.0"
license      = "GPL-3.0-or-later"

[[bin]]
name = "opencc600"
path = "./src/bin/main.rs"

[features]
# Power-cut test of the ride store on the device (tools/hil_storage.py); never in a normal build.
hil-storage = []
# A background map built in (`dump/bench.map`, `route-tool map`, for the route on the device): drawing benchmark
# until maps are sent; never in a normal build (the map is a real place).
bench-map = []

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "esp-radio",
  "embassy",
  "esp-alloc",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }

critical-section  = "1.2.0"
embedded-graphics = "0.8.2"
embassy-sync      = "0.8"
altitude          = { path = "../crates/altitude" }
fit               = { path = "../crates/fit" }
gnss              = { path = "../crates/gnss" }
nrf-link          = { path = "../crates/nrf-link" }
recorder          = { path = "../crates/recorder" }
# shared with the companion app Musette (MIT), same rev as the root Cargo.toml
route             = { package = "route-cc600", git = "https://github.com/enavarro222/musette", rev = "8fe1d38a0a23598fa3d2eb984eba78f194c53e02" }
settings          = { package = "settings-cc600", git = "https://github.com/enavarro222/musette", rev = "8fe1d38a0a23598fa3d2eb984eba78f194c53e02" }
protocol-cc600    = { package = "protocol-cc600", git = "https://github.com/enavarro222/musette", rev = "8fe1d38a0a23598fa3d2eb984eba78f194c53e02" }
ui                = { path = "../crates/ui" }
ride-store        = { path = "../crates/ride-store" }
static_cell      = "2.1.1"
littlefs2 = { version = "0.8.1", default-features = false, features = ["c-stubs"] }
esp-storage = { version = "0.10.0", features = ["embedded-storage", "esp32s3"] }
embedded-storage = "0.3.2"
esp-radio = { version = "1.0.0-beta.1", features = ["esp32s3", "ble", "log-04", "unstable", "esp-alloc"] }
trouble-host = { version = "0.7.0", features = ["log", "central", "peripheral", "gatt", "scan", "gatt-client-notification-max-subscribers-2", "gatt-client-notification-queue-size-4"] }
bt-hci = "0.9"
embassy-futures = "0.1"
heapless = "0.9"
sensors = { version = "0.1.0", path = "../crates/sensors" }
companion = { path = "../crates/companion" }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
