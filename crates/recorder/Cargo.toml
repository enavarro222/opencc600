[package]
name         = "recorder"
description  = "Ride recording: FIT activity files on ride-store, closed again after a power cut"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
version.workspace      = true

[dependencies]
altitude   = { path = "../altitude" }
fit        = { path = "../fit" }
ride-store = { path = "../ride-store" }

[dev-dependencies]
fit        = { path = "../fit" }
fitparser  = "0.11.0"
ride-store = { path = "../ride-store", features = ["ram"] }
